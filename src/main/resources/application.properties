spring.application.name=spring-boot-application

# MySQL datasource (can be overridden via environment variables)
# Example env names: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/department_db?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:12345678}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true

# H2 removed - this app uses MySQL only now

# Disable RabbitMQ by default when running with only MySQL. Set rabbitmq.enabled=true to enable messaging.
rabbitmq.enabled=false

rabbitmq.queue.name =department_queue
rabbitmq.exchange.name=department_exchange
rabbitmq.routing.key=department_routing_key